[package]
name = "tapestry-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4"] }
vt100 = "0.16.2"
