[package]
name = "tapestry-canvas-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tapestry-canvas"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
glam = "0.34.1"
tapestry-canvas = { version = "0.1.0", path = "../../crates/canvas" }
tapestry-vault = { version = "0.1.0", path = "../../crates/vault" }
png = "0.18.1"
egui_extras = { version = "0.36.2", default-features = false }
portable-pty = "0.9.0"
vt100 = "0.16.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
tungstenite = "0.29.0"
# Static embeddings for notes (Model2Vec): no network at run time, pure Rust
# tokenizer, fast enough for a phone.
model2vec-rs = { version = "0.3.0", default-features = false, features = ["fancy-regex", "local-only"] }
