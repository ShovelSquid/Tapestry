<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Surfaces</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #101215; --panel: rgba(24, 27, 32, .92); --ink: #e8e5df; --muted: #9a958c; --line: #2f343b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
  #panel { position: fixed; top: 12px; left: 12px; width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: flex; justify-content: space-between; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
  label b { color: var(--ink); }
  select, input[type=range] { width: 100%; }
  select { background: #1b1e23; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  .check { justify-content: flex-start; gap: 6px; color: var(--ink); }
  #hud { position: fixed; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  @media (max-width: 640px) { #panel { width: calc(100% - 24px); } #hud { left: 12px; } }
</style>
<script type="importmap">
  { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel">
  <h1>Vector Surfaces</h1>
  <label>Surface</label>
  <select id="method">
    <option value="cylinders">015: separate cylinders</option>
    <option value="sdf">016a: distance-field blend</option>
    <option value="tubes">016b: swept tubes</option>
    <option value="fast">017: fast distance field, gradient normals</option>
  </select>
  <label>Description</label><select id="preset"><option>tree</option><option>bridge</option><option>coral</option></select>
  <label>Levels <b id="levelV"></b></label><input id="level" type="range" min="1" max="6" value="4">
  <label>Voxel (016a) <b id="cellV"></b></label><input id="cell" type="range" min="0.02" max="0.1" step="0.01" value="0.04">
  <label class="check"><input id="wire" type="checkbox"> Wireframe</label>
</div>
<div id="hud">building…</div>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { expand, end } from '../015-generative-vectors/gen.mjs'
import { PRESETS } from '../015-generative-vectors/presets.mjs'
import { buildSdfMesh } from '../016a-sdf-surface-nets/sdf.mjs'
import { buildTubeMesh } from '../016b-swept-tubes/tubes.mjs'
import { buildFastSdfMesh } from '../017-fast-sdf/fast.mjs'

const $ = (id) => document.getElementById(id)
const q = new URLSearchParams(location.search)
for (const k of ['method', 'preset', 'level', 'cell']) if (q.get(k)) $(k).value = q.get(k)
if (q.get('wire')) $('wire').checked = true

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
document.body.prepend(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101215)
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 200)
const controls = new OrbitControls(camera, renderer.domElement)
const cam = (q.get('cam') || '7,5,9').split(',').map(Number)
const target = (q.get('target') || '0,3,0').split(',').map(Number)
camera.position.set(...cam); controls.target.set(...target)
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2118, 1.3))
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(5, 10, 6); scene.add(sun)
const material = new THREE.MeshStandardMaterial({ color: 0xb59a74, roughness: 0.7, metalness: 0.02 })
let mesh = null

function cylinderMesh(vectors) {
  const geo = new THREE.CylinderGeometry(1, 1, 1, 12, 1, true).translate(0, 0.5, 0)
  const inst = new THREE.InstancedMesh(geo, material, vectors.length)
  const m = new THREE.Matrix4(), up = new THREE.Vector3(0, 1, 0), quat = new THREE.Quaternion()
  vectors.forEach((v, i) => {
    quat.setFromUnitVectors(up, new THREE.Vector3(...v.dir))
    m.compose(new THREE.Vector3(...v.start), quat, new THREE.Vector3(v.radius, v.len, v.radius))
    inst.setMatrixAt(i, m)
  })
  return { object: inst, triangles: vectors.length * 24 }
}

function toThree(built) {
  const geo = new THREE.BufferGeometry()
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(built.positions), 3))
  geo.setIndex(new THREE.BufferAttribute(built.indices, 1))
  if (built.normals) geo.setAttribute('normal', new THREE.BufferAttribute(built.normals, 3))
  else geo.computeVertexNormals()
  return { object: new THREE.Mesh(geo, material), triangles: built.indices.length / 3 }
}

async function build() {
  $('levelV').textContent = $('level').value
  $('cellV').textContent = $('cell').value
  $('hud').textContent = 'building…'
  await new Promise((r) => setTimeout(r, 20))
  const vectors = expand(PRESETS[$('preset').value], Number($('level').value)).levels.flat()
  const t0 = performance.now()
  const method = $('method').value
  const out = method === 'cylinders' ? cylinderMesh(vectors)
    : method === 'sdf' ? toThree(buildSdfMesh(vectors, { cell: Number($('cell').value) }))
    : method === 'fast' ? toThree(buildFastSdfMesh(vectors, { cell: Number($('cell').value), normals: true }))
    : toThree(buildTubeMesh(vectors))
  const ms = performance.now() - t0
  if (mesh) scene.remove(mesh)
  mesh = out.object; scene.add(mesh)
  material.wireframe = $('wire').checked
  $('hud').innerHTML = `${$('method').selectedOptions[0].text}<br>${vectors.length} vectors → ${out.triangles.toLocaleString()} triangles<br>built in ${ms.toFixed(0)} ms`
  window.__state = { method, ms, triangles: out.triangles }
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix() }
addEventListener('resize', resize); resize()
for (const id of ['method', 'preset', 'level', 'cell', 'wire']) $(id).onchange = build
window.__ready = build()
;(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop) })()
</script>
</body>
</html>
