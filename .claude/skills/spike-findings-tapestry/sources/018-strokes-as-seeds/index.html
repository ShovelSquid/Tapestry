<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strokes as Seeds</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #101215; --panel: rgba(24, 27, 32, .93); --ink: #e8e5df; --muted: #9a958c; --line: #2f343b; --accent: #7fb0e0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; top: 12px; left: 12px; width: 270px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 2px; } p.sub { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  button { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: #1b1e23; color: var(--ink); font: inherit; cursor: pointer; }
  button.on { background: var(--accent); color: #0c1116; border-color: var(--accent); }
  label { display: flex; justify-content: space-between; margin: 8px 0 2px; color: var(--muted); font-size: 12px; }
  label b { color: var(--ink); }
  input[type=range], select { width: 100%; }
  select { background: #1b1e23; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  .check { justify-content: flex-start; gap: 6px; color: var(--ink); }
  .role { color: var(--muted); font-size: 11px; }
  #hud { position: fixed; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; max-width: 380px; }
  @media (max-width: 640px) { #panel { width: calc(100% - 24px); max-height: 50%; } #hud { left: 12px; } }
</style>
<script type="importmap">
  { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel">
  <h1>Strokes as Seeds</h1>
  <p class="sub">Draw on a plane. Each stroke is fitted into seeds, knots or mass, and the object regrows.</p>
  <div class="row" id="modes"><button data-mode="draw" class="on">Draw</button><button data-mode="orbit">Orbit</button></div>
  <label>Brush</label>
  <div class="row" id="brushes">
    <button data-brush="ink" class="on">ink <span class="role">stem</span></button>
    <button data-brush="lead">lead <span class="role">anchor</span></button>
    <button data-brush="clay">clay <span class="role">mass</span></button>
    <button data-brush="rust">rust <span class="role">knot</span></button>
  </div>
  <label>Plane</label>
  <div class="row" id="planes"><button data-plane="front" class="on">front</button><button data-plane="side">side</button><button data-plane="top">top</button></div>
  <label>Session</label>
  <select id="session"><option value="sapling">sapling (6 strokes)</option><option value="lantern">lantern (3 planes)</option><option value="blank">blank</option></select>
  <label>Levels <b id="levelV"></b></label><input id="level" type="range" min="0" max="6" value="4">
  <label class="check"><input id="surface" type="checkbox" checked> Surface (017)</label>
  <label class="check"><input id="overlay" type="checkbox" checked> Show strokes, seeds and knots</label>
  <div class="row"><button id="undo">Undo stroke</button><button id="export">Export actions</button></div>
</div>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { expand, canonical } from '../015-generative-vectors/gen.mjs'
import { buildFastSdfMesh } from '../017-fast-sdf/fast.mjs'
import { fitStrokes, readActions, ROLES } from './strokes.mjs'
import { BRUSHES, PLANES, SESSIONS } from './sessions.mjs'

const $ = (id) => document.getElementById(id)
const q = new URLSearchParams(location.search)
const Q = 65536
const COLORS = { stem: 0x8fd18a, anchor: 0xb0a595, mass: 0xd9a066, knot: 0xe07a5f }
const BRUSH_ID = { ink: 1, rust: 2, clay: 3, lead: 4 }

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
document.body.prepend(renderer.domElement)
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101215)
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200)
camera.position.set(...(q.get('cam') || '0,3,13').split(',').map(Number))
const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 2.6, 0)
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2118, 1.3))
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(5, 10, 6); scene.add(sun)

let actions = []
let mode = 'draw', brush = 'ink', plane = 'front'
let grown = new THREE.Group(), overlay = new THREE.Group()
scene.add(grown, overlay)

// The drawing plane, shown as a grid through the origin.
const planeGrid = new THREE.GridHelper(12, 24, 0x3a4048, 0x252a30)
scene.add(planeGrid)
function planeFrame(name) {
  const p = PLANES[name]
  return { origin: new THREE.Vector3(p[0], p[1], p[2]), right: new THREE.Vector3(p[3], p[4], p[5]), up: new THREE.Vector3(p[6], p[7], p[8]) }
}
function showPlane() {
  const f = planeFrame(plane)
  const normal = new THREE.Vector3().crossVectors(f.right, f.up)
  planeGrid.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal)
  planeGrid.position.copy(f.origin).addScaledVector(f.up, 3).addScaledVector(normal, 0)
}

function nextStrokeId() { return actions.filter((a) => a.kind === 'StrokeBegin').reduce((m, a) => Math.max(m, a.strokeId), 0) + 1 }

// --- capture: pointer → data-drawing samples, quantized once --------------
const ray = new THREE.Raycaster()
let live = null
let tick = 0
function planeHit(e) {
  const r = renderer.domElement.getBoundingClientRect()
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera)
  const f = planeFrame(plane)
  const normal = new THREE.Vector3().crossVectors(f.right, f.up)
  const hit = new THREE.Vector3()
  if (!ray.ray.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(normal, f.origin), hit)) return null
  const d = hit.clone().sub(f.origin)
  return { u: d.dot(f.right), v: d.dot(f.up) }
}
function sampleFrom(e, index) {
  const h = planeHit(e)
  if (!h) return null
  return { tick, index, pressure: Math.round(Math.min(1, Math.max(0, e.pressure || 0.5)) * 65535), u: Math.round(h.u * Q), v: Math.round(h.v * Q),
    tiltX: Math.max(-128, Math.min(127, Math.round(e.tiltX || 0))), tiltY: Math.max(-128, Math.min(127, Math.round(e.tiltY || 0))), twist: Math.round(e.twist || 0) & 0xffff, flags: 0 }
}
const liveLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffffff }))
scene.add(liveLine)
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'draw' || e.button !== 0) return
  renderer.domElement.setPointerCapture(e.pointerId)
  const id = nextStrokeId()
  live = { id, samples: [], begin: { kind: 'StrokeBegin', strokeId: id, brushVersionId: BRUSH_ID[brush], startTick: tick, pressureSource: e.pointerType === 'pen' ? 1 : 0, plane: PLANES[plane].map((x) => Math.round(x * Q)) } }
  const s = sampleFrom(e, 0); if (s) live.samples.push(s)
})
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!live) return
  for (const ce of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) {
    const s = sampleFrom(ce, live.samples.length)
    if (s) live.samples.push(s)
  }
  const f = planeFrame(plane)
  liveLine.geometry.setFromPoints(live.samples.map((s) => f.origin.clone().addScaledVector(f.right, s.u / Q).addScaledVector(f.up, s.v / Q)))
})
renderer.domElement.addEventListener('pointerup', () => {
  if (!live) return
  if (live.samples.length >= 2) {
    actions.push(live.begin, { kind: 'StrokeSamples', strokeId: live.id, samples: live.samples }, { kind: 'StrokeEnd', strokeId: live.id, endTick: tick })
  }
  live = null
  liveLine.geometry.setFromPoints([])
  rebuild()
})

// --- fit, grow, surface ------------------------------------------------------
async function sha16(bytes) {
  const d = await crypto.subtle.digest('SHA-256', bytes)
  return [...new Uint8Array(d)].slice(0, 8).map((b) => b.toString(16).padStart(2, '0')).join('')
}
const material = new THREE.MeshStandardMaterial({ color: 0xb59a74, roughness: 0.7 })
async function rebuild() {
  $('levelV').textContent = $('level').value
  const t0 = performance.now()
  const { description, fit } = fitStrokes(actions)
  const t1 = performance.now()
  const levels = description.seeds.length ? expand(description, Number($('level').value)).levels : [[]]
  const vectors = levels.flat()
  const t2 = performance.now()
  scene.remove(grown); grown = new THREE.Group(); scene.add(grown)
  let surfaceMs = 0, triangles = 0, meshHash = '—'
  if ($('surface').checked && vectors.length) {
    const m = buildFastSdfMesh(vectors, { cell: 0.05, normals: true })
    surfaceMs = performance.now() - t2
    const geo = new THREE.BufferGeometry()
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(m.positions), 3))
    geo.setAttribute('normal', new THREE.BufferAttribute(m.normals, 3))
    geo.setIndex(new THREE.BufferAttribute(m.indices, 1))
    grown.add(new THREE.Mesh(geo, material))
    triangles = m.indices.length / 3
    meshHash = await sha16(new Uint8Array([...new Uint8Array(m.positions.buffer), ...new Uint8Array(m.indices.buffer)]))
  } else if (vectors.length) {
    const cyl = new THREE.CylinderGeometry(1, 1, 1, 7).translate(0, 0.5, 0)
    const inst = new THREE.InstancedMesh(cyl, material, vectors.length)
    const m = new THREE.Matrix4(), up = new THREE.Vector3(0, 1, 0), quat = new THREE.Quaternion()
    vectors.forEach((v, i) => { quat.setFromUnitVectors(up, new THREE.Vector3(...v.dir)); m.compose(new THREE.Vector3(...v.start), quat, new THREE.Vector3(v.radius, v.len, v.radius)); inst.setMatrixAt(i, m) })
    grown.add(inst)
  }
  drawOverlay(description)
  const vecHash = vectors.length ? await sha16(canonical(levels).buf.buffer) : '—'
  const actionBytes = new Blob([JSON.stringify(actions)]).size
  const roles = Object.entries(fit.byRole).map(([k, v]) => `${v} ${k}`).join(', ') || 'none'
  $('hud').innerHTML = `${fit.strokes} strokes (${roles}), ${fit.samples} samples, ${(actionBytes / 1024).toFixed(1)} KB of actions<br>
    → ${fit.seeds} seeds, ${fit.knots} knots, ${fit.attractors} attractors<br>
    → ${vectors.length.toLocaleString()} vectors${triangles ? ` → ${triangles.toLocaleString()} triangles` : ''}<br>
    fit ${(t1 - t0).toFixed(1)} ms · grow ${(t2 - t1).toFixed(0)} ms${surfaceMs ? ` · surface ${surfaceMs.toFixed(0)} ms` : ''}<br>
    vectors ${vecHash} · mesh ${meshHash}`
  window.__state = { strokes: fit.strokes, seeds: fit.seeds, knots: fit.knots, vectors: vectors.length, fitMs: t1 - t0, growMs: t2 - t1, surfaceMs, vecHash, meshHash, actions }
}

function drawOverlay(description) {
  scene.remove(overlay); overlay = new THREE.Group(); scene.add(overlay)
  if (!$('overlay').checked) return
  for (const s of readActions(actions)) {
    const f = { origin: new THREE.Vector3(...s.origin), right: new THREE.Vector3(...s.right), up: new THREE.Vector3(...s.up) }
    const pts = s.samples.map((x) => f.origin.clone().addScaledVector(f.right, x.u / Q).addScaledVector(f.up, x.v / Q))
    overlay.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: COLORS[ROLES[s.brush.description]], transparent: true, opacity: 0.55 })))
  }
  const byId = new Map(description.seeds.map((s) => [s.id, s]))
  const seg = []
  for (const s of description.seeds) seg.push(new THREE.Vector3(...s.start), new THREE.Vector3(...s.start).addScaledVector(new THREE.Vector3(...s.dir), s.len))
  overlay.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg), new THREE.LineBasicMaterial({ color: 0xffffff })))
  const kp = []
  for (const k of description.knots) {
    const a = byId.get(k.from), b = byId.get(k.to)
    const mid = (s) => new THREE.Vector3(...s.start).addScaledVector(new THREE.Vector3(...s.dir), s.len * 0.5)
    kp.push(mid(a), mid(b))
  }
  if (kp.length) { const l = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(kp), new THREE.LineDashedMaterial({ color: 0xe07a5f, dashSize: 0.15, gapSize: 0.1 })); l.computeLineDistances(); overlay.add(l) }
  if (description.attractors.length) overlay.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(description.attractors.map((a) => new THREE.Vector3(...a.p))), new THREE.PointsMaterial({ color: 0xd9a066, size: 0.12 })))
}

// --- controls ---------------------------------------------------------------
function pick(groupId, attr, set) {
  for (const b of $(groupId).children) b.onclick = () => { for (const x of $(groupId).children) x.classList.toggle('on', x === b); set(b.dataset[attr]) }
}
pick('modes', 'mode', (m) => { mode = m; controls.enabled = m === 'orbit' })
pick('brushes', 'brush', (b) => { brush = b })
pick('planes', 'plane', (p) => { plane = p; showPlane() })
function loadSession() { actions = $('session').value === 'blank' ? [...BRUSHES] : SESSIONS[$('session').value](); rebuild() }
$('session').onchange = loadSession
$('level').oninput = rebuild
$('surface').onchange = rebuild
$('overlay').onchange = rebuild
$('undo').onclick = () => {
  const last = actions.filter((a) => a.kind === 'StrokeBegin').pop()
  if (last) { actions = actions.filter((a) => a.strokeId !== last.strokeId); rebuild() }
}
$('export').onclick = () => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([JSON.stringify(actions, null, 1)], { type: 'application/json' }))
  a.download = `strokes-${Date.now()}.json`; a.click()
}
controls.enabled = false
if (q.get('session')) $('session').value = q.get('session')
if (q.get('level')) $('level').value = q.get('level')
if (q.get('surface') === '0') $('surface').checked = false
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix() }
addEventListener('resize', resize); resize()
showPlane()
loadSession()
;(function loop() { tick++; controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop) })()
</script>
</body>
</html>
