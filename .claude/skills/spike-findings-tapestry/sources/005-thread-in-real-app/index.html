<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spike 005 — thread in the real app</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #root { width: 100vw; height: 100vh; }

      /* D-09 stacks these: the notes are at the bottom, the scrim dims the
         canvas BEHIND the line, and the line draws over the dimmed canvas with
         the typer above everything.
           notes (canvas) → scrim → thread → typer
         Getting this wrong is not subtle but it is invisible in a frame rate:
         with the scrim over the GL layer, the thread is both dimmed and drawn
         as white glyphs onto the canvas's cream #F7F5F0, so it vanishes while
         every counter still reports 62 k glyphs loaded. */
      #thread-scrim {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background: rgba(10, 12, 18, 0.55); opacity: 0; transition: opacity 160ms ease;
      }
      .thread-open #thread-scrim { opacity: 1; }
      #thread-gl {
        position: fixed; inset: 0; z-index: 2; pointer-events: none;
      }

      #typer {
        position: fixed; top: 96px; left: 50%; transform: translateX(-50%);
        width: min(760px, 70vw); max-height: 280px; overflow: auto; z-index: 4;
        background: rgba(16, 19, 27, 0.92); border: 1px solid #2a3040; border-radius: 10px;
        padding: 14px 16px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      #editor { color: #e8ecf6; font: 15px/1.6 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif; }
      #editor .ProseMirror { outline: none; white-space: pre-wrap; min-height: 84px; }

      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 8px;
        background: rgba(10, 12, 18, 0.82); color: #cfd6e6; white-space: pre; z-index: 10;
        font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./mount.tsx"></script>
  </body>
</html>
