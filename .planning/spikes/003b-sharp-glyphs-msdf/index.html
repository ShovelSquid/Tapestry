<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 8px;
        background: rgba(10, 12, 18, 0.78); color: #cfd6e6; white-space: pre;
        font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; pointer-events: none;
      }
      #input { position: fixed; left: 12px; bottom: 12px; width: 4px; height: 4px; opacity: 0; border: 0; padding: 0; resize: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "@mapbox/tiny-sdf": "/node_modules/@mapbox/tiny-sdf/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud"></div>
    <textarea id="input" autocomplete="off" spellcheck="false"></textarea>
    <script type="module" src="./glyphs.js"></script>
  </body>
</html>
